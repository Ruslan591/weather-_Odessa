name: Калибровка Fog RGB (ночь) — сбор датасета

# Ручной запуск. Пятый канал в очереди калибровки по историческим SYNOP
# (после GeoColour день/ИК/Type RGB/GeoColour ночь — все закрыты). Fog RGB
# (mtg_fd:rgb_fog) — ночная замена Phase RGB в eumetsat_cloud_phase_type.py,
# self-relative контрастный классификатор (_classify_contrast,
# sigma_threshold=1.0, не откалиброван). Тянет ~73 ночных SYNOP-срока,
# считает cloud_fraction для сетки (радиус x sigma_threshold). См.
# docs/topics/eumetsat.md.

on:
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Python-зависимостей
        run: pip install numpy scipy Pillow requests

      - name: Настройка git для коммитов
        run: |
          git config user.name "gh-calibration-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Сбор калибровочного датасета Fog RGB
        working-directory: scripts
        run: python calibration_fog_collect.py

      - name: Коммит и пуш результата
        run: |
          set -e
          if [ -z "$(git status --porcelain data/calibration_fog_synop.jsonl 2>/dev/null)" ]; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git add data/calibration_fog_synop.jsonl
          git commit -m "data: калибровочный датасет Fog RGB (ночь)"
          for i in 1 2 3; do
            if git push; then
              echo "push успешен (попытка $i)"
              break
            fi
            echo "push не удался (попытка $i), git pull --rebase и повтор..."
            git pull --rebase origin main
            if [ "$i" = "3" ]; then
              echo "::error::push не удался после 3 попыток"
              exit 1
            fi
          done
