name: Калибровка GeoColour (историческая, по SYNOP)

# Ручной запуск — НЕ часть обычного пайплайна (satellite_pipeline.yml /
# full_pipeline.yml), не гейтится по времени, не триггерится автоматически.
# Собирает калибровочный датасет для GeoColour-классификатора по 200
# стратифицированным историческим SYNOP-срокам. См.
# docs/topics/eumetsat.md, раздел "решение — калибровка по историческим
# SYNOP" (2026-08-11) для полного плана и порядка каналов.
#
# Идемпотентно: уже собранные timestamp'ы в
# data/calibration_geocolour_synop.jsonl пропускаются, поэтому повторный
# запуск (например, после сетевого сбоя на части сроков) просто добьёт
# недостающее, не задублирует.

on:
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Python-зависимостей
        run: pip install numpy scipy Pillow requests

      - name: Настройка git для коммитов
        run: |
          git config user.name "gh-calibration-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Сбор калибровочного датасета GeoColour
        working-directory: scripts
        run: python calibration_geocolour_collect.py

      - name: Коммит и пуш результата
        run: |
          set -e
          if [ -z "$(git status --porcelain data/calibration_geocolour_synop.jsonl 2>/dev/null)" ]; then
            echo "Нет изменений в data/calibration_geocolour_synop.jsonl — нечего коммитить"
            exit 0
          fi
          git add data/calibration_geocolour_synop.jsonl
          git commit -m "data: калибровочный датасет GeoColour (SYNOP-сверка)"
          for i in 1 2 3; do
            if git push; then
              echo "push успешен (попытка $i)"
              break
            fi
            echo "push не удался (попытка $i), git pull --rebase и повтор..."
            git pull --rebase origin main
            if [ "$i" = "3" ]; then
              echo "::error::push не удался после 3 попыток"
              exit 1
            fi
          done
