name: Калибровка GeoColour — перебор порогов (день)

# Ручной запуск — НЕ часть обычного пайплайна. Перебирает сетку S/V порогов
# дневного _classify_cloud() на уже отснятых 200 исторических кадрах (см.
# docs/topics/eumetsat.md, "методологический вопрос — радиус сравнения со
# SYNOP N", 2026-08-11). Результат — data/calibration_geocolour_threshold_sweep.jsonl.

on:
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Python-зависимостей
        run: pip install numpy scipy Pillow requests

      - name: Настройка git для коммитов
        run: |
          git config user.name "gh-calibration-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Перебор порогов GeoColour (день)
        working-directory: scripts
        run: python calibration_geocolour_threshold_sweep.py

      - name: Коммит и пуш результата
        run: |
          set -e
          if [ -z "$(git status --porcelain data/calibration_geocolour_threshold_sweep.jsonl 2>/dev/null)" ]; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git add data/calibration_geocolour_threshold_sweep.jsonl
          git commit -m "data: перебор S/V порогов GeoColour (день)"
          for i in 1 2 3; do
            if git push; then
              echo "push успешен (попытка $i)"
              break
            fi
            echo "push не удался (попытка $i), git pull --rebase и повтор..."
            git pull --rebase origin main
            if [ "$i" = "3" ]; then
              echo "::error::push не удался после 3 попыток"
              exit 1
            fi
          done
