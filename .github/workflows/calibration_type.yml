name: Калибровка Type RGB (историческая, по SYNOP)

# Ручной запуск — НЕ часть обычного пайплайна. Третий канал в очереди
# (после GeoColour день и ИК, оба закрыты 2026-08-11). Приоритет Type
# перед Phase: confirmed в target_confirmation считается по Type, Phase —
# чисто описательное поле. См. docs/topics/eumetsat.md.
#
# ОТДЕЛЬНАЯ выборка от GeoColour/ИК — data/calibration_type_sample.json,
# стратифицирована по expected_group (0/1/2), выведенной из SYNOP
# CL/CM/CH, а не по N.

on:
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Python-зависимостей
        run: pip install numpy scipy Pillow requests

      - name: Настройка git для коммитов
        run: |
          git config user.name "gh-calibration-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Сбор калибровочного датасета Type RGB
        working-directory: scripts
        run: python calibration_type_collect.py

      - name: Коммит и пуш результата
        run: |
          set -e
          if [ -z "$(git status --porcelain data/calibration_type_synop.jsonl 2>/dev/null)" ]; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git add data/calibration_type_synop.jsonl
          git commit -m "data: калибровочный датасет Type RGB (SYNOP-сверка)"
          for i in 1 2 3; do
            if git push; then
              echo "push успешен (попытка $i)"
              break
            fi
            echo "push не удался (попытка $i), git pull --rebase и повтор..."
            git pull --rebase origin main
            if [ "$i" = "3" ]; then
              echo "::error::push не удался после 3 попыток"
              exit 1
            fi
          done
