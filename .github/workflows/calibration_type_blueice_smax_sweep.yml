name: Sweep s_max для правила blue_ice (Type RGB)

# Ручной запуск. Финальная проверка перед применением фикса: диагностика
# нашла, что правило blue_ice каскада _classify_type() — источник ложных
# срабатываний на ясном небе, и что Saturation (не V) хорошо разделяет
# ясное море (S выше) от настоящих высоких облаков (S ниже) в том же
# Hue-диапазоне. Этот прогон измеряет ПОЛНУЮ (не record-proxy) площадь
# ложной/истинной облачности на 41 ясном + 51 облачном сроке для сетки
# кандидатов s_max. См. docs/topics/eumetsat.md.

on:
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Python-зависимостей
        run: pip install numpy scipy Pillow requests

      - name: Настройка git для коммитов
        run: |
          git config user.name "gh-calibration-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Sweep s_max для blue_ice
        working-directory: scripts
        run: python calibration_type_blueice_smax_sweep.py

      - name: Коммит и пуш результата
        run: |
          set -e
          if [ -z "$(git status --porcelain data/calibration_type_blueice_smax_sweep.jsonl 2>/dev/null)" ]; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git add data/calibration_type_blueice_smax_sweep.jsonl
          git commit -m "data: sweep s_max для правила blue_ice Type RGB"
          for i in 1 2 3; do
            if git push; then
              echo "push успешен (попытка $i)"
              break
            fi
            echo "push не удался (попытка $i), git pull --rebase и повтор..."
            git pull --rebase origin main
            if [ "$i" = "3" ]; then
              echo "::error::push не удался после 3 попыток"
              exit 1
            fi
          done
