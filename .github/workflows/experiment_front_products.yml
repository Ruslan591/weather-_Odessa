name: Experiment - EUMETSAT front detection products (isolated)

on:
  workflow_dispatch: {}

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy Pillow requests scipy
      - name: Run experiment collector (isolated, no production files touched)
        run: python scripts/experiments/eumetsat_front_products_experiment.py
      - name: Commit experiment results only
        run: |
          git config user.name "eumetsat-front-experiment-bot"
          git config user.email "actions@github.com"
          git add data/experiments/eumetsat_front_products
          git diff --cached --quiet || git commit -m "experiment: EUMETSAT front detection products (isolated, no production change)"
          for i in 1 2 3; do
            git push && break
            git fetch origin main
            git rebase origin/main
          done
