name: Дальний контроль (EUMETSAT far/very_far)

# Два независимых расписания в одном workflow — тир выбирается по тому,
# КАКОЙ cron сработал (github.event.schedule), см. шаг "Определить тир" ниже.
# Смещение от круглых минут (:17/:23) — GitHub Actions ненадёжен на ровных
# минутах при высокой общей нагрузке платформы (см. память проекта).
on:
  schedule:
    - cron: "17,47 * * * *"   # far (~1000км) — каждые 30 минут
    - cron: "23 */3 * * *"    # very_far (~2500км) — раз в 3 часа
  workflow_dispatch:
    inputs:
      tier:
        description: "Тир при ручном запуске"
        required: false
        default: "far"
        type: choice
        options: ["far", "very_far"]

concurrency:
  group: far-watch
  cancel-in-progress: false

jobs:
  run-far-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Python-зависимостей
        run: pip install numpy Pillow requests

      - name: Настройка git для коммитов
        run: |
          git config user.name "gh-satellite-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Определить тир по расписанию
        id: tier
        run: |
          if [ "${{ github.event.schedule }}" = "23 */3 * * *" ]; then
            echo "tier=very_far" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tier }}" ]; then
            echo "tier=${{ github.event.inputs.tier }}" >> "$GITHUB_OUTPUT"
          else
            echo "tier=far" >> "$GITHUB_OUTPUT"
          fi

      - name: Запуск eumetsat_far_watch.py
        run: python scripts/eumetsat_far_watch.py ${{ steps.tier.outputs.tier }}
