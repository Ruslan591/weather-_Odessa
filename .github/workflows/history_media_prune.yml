name: History media prune

# Еженедельно вырезает из git-истории старые версии мультимедиа-файлов
# (mp4/mp3/png/jpg/jpeg/gif/webp), оставляя последние 24 часа + последнюю
# версию каждого пути (чтобы файл не исчез из HEAD). JSON/npz/код/docs не трогает.
#
# Безопасность:
#  - Ручной запуск (workflow_dispatch) по умолчанию идёт в mode=analyze
#    (только отчёт, ничего не меняет) — нужно явно выбрать execute.
#  - Еженедельный автозапуск (schedule) идёт в execute ТОЛЬКО если в репозитории
#    существует файл .github/HISTORY_PRUNE_CONFIRMED — иначе тоже analyze.
#    Это даёт возможность посмотреть отчёт хотя бы один раз до первого
#    реального force-push.

on:
  schedule:
    - cron: '0 3 * * 0'  # воскресенье, 03:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'analyze = только отчёт, execute = переписать историю и force-push'
        type: choice
        options:
          - analyze
          - execute
        default: analyze

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h

      - name: Checkout (для скрипта и проверки маркера)
        uses: actions/checkout@v4
        with:
          path: work

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ -f work/.github/HISTORY_PRUNE_CONFIRMED ]; then
            echo "mode=execute" >> "$GITHUB_OUTPUT"
          else
            echo "mode=analyze" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Install git-filter-repo
        run: pip install --user git-filter-repo

      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          du -sh repo

      - name: Run prune
        working-directory: repo
        env:
          REPO_PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -o pipefail
          git config user.email "actions@github.com"
          git config user.name "history-prune-bot"
          python3 "${{ github.workspace }}/work/scripts/gh_history_prune.py" --mode "${{ steps.mode.outputs.mode }}" \
            2>&1 | tee "${{ github.workspace }}/prune_report.txt"

      - name: Publish report to repo
        if: always()
        working-directory: work
        run: |
          mkdir -p .github
          {
            echo "# History prune report"
            echo "run: ${{ github.run_id }} | trigger: ${{ github.event_name }} | mode: ${{ steps.mode.outputs.mode }} | when: $(date -u +%FT%TZ)"
            echo
            cat "${{ github.workspace }}/prune_report.txt"
          } > .github/history_prune_last_report.txt
          git config user.email "actions@github.com"
          git config user.name "history-prune-bot"
          git add .github/history_prune_last_report.txt
          git commit -m "History prune report (mode=${{ steps.mode.outputs.mode }})" || echo "nothing to commit"
          # За время клонирования 20 ГБ основной пайплайн (коммиты каждые ~15 мин)
          # почти наверняка уйдёт вперёд -> обычный push будет non-fast-forward.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "push OK (попытка $i)"
                break
              fi
            else
              git rebase --abort || true
            fi
            echo "попытка $i не удалась, жду и повторяю"
            sleep 5
          done

      - name: Repo size after
        if: steps.mode.outputs.mode == 'execute'
        working-directory: repo
        run: du -sh .git
