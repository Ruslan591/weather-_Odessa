name: Generate Video

on:
  push:
    paths:
      - 'data/blocks/blocks_meta.json'
      - 'data/blocks/*.mp3'
  workflow_dispatch:

concurrency:
  group: video-generation
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg fonts-crosextra-carlito
          pip install Pillow numpy

      - name: Generate video
        id: genvideo
        continue-on-error: true
        run: |
          python3 scripts/make_video.py > /tmp/video_debug.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -c 60000 /tmp/video_debug.log > data/_debug_video_log.txt || true

      - name: Commit debug log (temporary diagnostics)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/_debug_video_log.txt || true
          git diff --cached --quiet && echo "No debug changes" && exit 0
          git commit -m "debug: video generation log (temporary)"
          for i in 1 2 3; do
            git pull --rebase origin main
            git push && break
            echo "Retry $i..."
            sleep 5
          done

      - name: Fail job if video generation failed
        if: steps.genvideo.outputs.exit != '0'
        run: exit 1

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast_video.mp4
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: generate forecast video"
          for i in 1 2 3; do
            git stash || true
            git pull --rebase origin main
            git stash pop || true
            git push && break
            echo "Retry $i..."
            sleep 5
          done
