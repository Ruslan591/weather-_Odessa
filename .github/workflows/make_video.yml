name: Generate Video

on:
  push:
    paths:
      - 'data/blocks/blocks_meta.json'
      - 'data/blocks/*.mp3'
  workflow_dispatch:

concurrency:
  group: video-generation
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg fonts-crosextra-carlito
          pip install Pillow numpy

      - name: Generate video
        id: genvideo
        continue-on-error: true
        run: |
          python3 scripts/make_video.py > /tmp/video_debug.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -c 60000 /tmp/video_debug.log > /tmp/debug_trimmed.log || true

      - name: Push debug log via API (temporary diagnostics, no working-tree touch)
        if: always()
        env:
          GH_TOKEN_DEBUG: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXITCODE: ${{ steps.genvideo.outputs.exit }}
        run: |
          python3 << 'PYEOF'
          import json, base64, os, urllib.request

          token = os.environ["GH_TOKEN_DEBUG"]
          repo = os.environ["REPO"]
          exitcode = os.environ.get("EXITCODE", "?")

          with open("/tmp/debug_trimmed.log", "rb") as f:
              content = f.read()

          url = f"https://api.github.com/repos/{repo}/contents/data/_debug_video_log.txt"
          req = urllib.request.Request(url, headers={"Authorization": f"token {token}"})
          sha = None
          try:
              with urllib.request.urlopen(req) as r:
                  sha = json.load(r).get("sha")
          except Exception:
              pass

          payload = {
              "message": f"debug: video generation log (temporary, exit={exitcode})",
              "content": base64.b64encode(content).decode(),
              "branch": "main",
          }
          if sha:
              payload["sha"] = sha

          req2 = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Authorization": f"token {token}", "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req2) as r2:
              print(r2.status)
          PYEOF

      - name: Fail job if video generation failed
        if: steps.genvideo.outputs.exit != '0'
        run: exit 1

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast_video.mp4
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: generate forecast video"
          for i in 1 2 3; do
            git stash || true
            git pull --rebase origin main
            git stash pop || true
            git push && break
            echo "Retry $i..."
            sleep 5
          done
