name: Спутниковый пайплайн (EUMETSAT)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: satellite-pipeline
  cancel-in-progress: false

jobs:
  run-satellite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Python-зависимостей
        run: pip install numpy scipy Pillow requests

      - name: Настройка git для коммитов
        run: |
          git config user.name "gh-satellite-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Запуск спутникового пайплайна
        run: python scripts/gh_satellite_pipeline.py
