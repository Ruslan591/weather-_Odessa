<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14"><meta name="color-scheme" content="dark">
<title>Бот · онлайн</title>
<style>
:root{--bg:#0b0e14;--card:#141923;--bd:#232b3a;--tx:#e6e9ef;--mut:#8b94a7;--g:#2ebd85;--r:#f6465d;--a:#f0b90b;--b:#4c8dff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 10px calc(env(safe-area-inset-bottom,0) + 24px)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--r);flex:none}.dot.ok{background:var(--g)}.dot.warn{background:var(--a)}
.big{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.small{font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 2px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.card.tap{cursor:pointer}.card.tap:active{border-color:var(--b)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid div{font-variant-numeric:tabular-nums}.grid b{display:block;font-size:15px}
.bar{position:relative;height:6px;border-radius:3px;margin:9px 2px 4px;background:linear-gradient(90deg,var(--r),var(--bd) 50%,var(--g))}
.bar i{position:absolute;top:-4px;width:3px;height:14px;background:var(--tx);border-radius:2px}.bar u{position:absolute;top:-2px;width:2px;height:10px;background:var(--mut)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;background:var(--bd)}
.pill.L{background:rgba(46,189,133,.2);color:var(--g)}.pill.S{background:rgba(246,70,93,.2);color:var(--r)}
.cb{background:var(--bd);color:var(--tx);border:0;border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;flex:none}.cb.on{background:var(--b);color:#fff}
.ev{padding:5px 2px;border-bottom:1px solid var(--bd);word-break:break-word}.ev time{color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.ev.n{animation:fl 2.5s}@keyframes fl{from{background:rgba(76,141,255,.25)}to{background:transparent}}
.ar{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--bd);cursor:pointer;font-variant-numeric:tabular-nums}.ar:active{background:var(--card)}
#msg{padding:30px 10px;text-align:center;color:var(--mut)}
#chart{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top,0) 8px calc(env(safe-area-inset-bottom,0) + 8px)}
#ch_h{flex-wrap:nowrap!important;overflow-x:auto;gap:6px;padding:6px 0}#ch_t{flex-wrap:nowrap;gap:5px;padding-top:6px}#ch_t .cb{flex:1;padding:8px 0;font-size:14px}#chart.on{display:flex}#ch_c{flex-wrap:nowrap;gap:6px;padding-top:6px}#ch_c .cb{flex:1;padding:9px 0;font-size:13px}.cb.red{background:#5a2330;color:#ffb3bd}.cb.grn{background:#1d4d3a;color:#b6f0d6}#ctlbadge{font-size:11px;padding:1px 6px;border-radius:8px;background:#5a2330;color:#ffb3bd;margin-left:4px}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:30;background:#1b2231;border:1px solid #3a4560;border-radius:12px;padding:12px}#sheet .t{font-weight:700;margin-bottom:4px}#sheet .d{color:var(--mut);font-size:12px;margin-bottom:10px}#sheet .r{display:flex;gap:8px;flex-wrap:wrap}#sheet .cb{flex:1;padding:11px 0;font-size:14px}
#toast{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:40;padding:9px 12px;border-radius:10px;background:#1b2231;border:1px solid #3a4560;font-size:13px}#cv{flex:1;width:100%;min-height:0;display:block;touch-action:none}
</style></head><body>
<div class="top"><div class="row"><span class="dot" id="dot"></span><span id="conn" class="small mut">подключение…</span><span class="sp"></span><span id="mode" class="small mut"></span></div>
<div class="row" style="margin-top:4px"><span class="big" id="btc">BTC —</span><span id="k" class="small"></span><span class="sp"></span><span id="cols" class="small"></span></div>
<div class="small mut" id="reg"></div></div>
<div id="msg">Подключение…</div>
<div id="main" hidden>
<h2>Счёт</h2><div class="card grid" id="acc"></div>
<h2>Открытые позиции</h2><div id="open"></div>
<h2>Ордера в ожидании</h2><div id="pend"></div>
<h2>Слежения у линий</h2><div id="watch"></div>
<h2 id="evt_h" style="cursor:pointer">События <span id="evt_n"></span> <span id="evt_a">▸</span></h2><div class="card" id="evt" hidden></div>
<h2>Архив закрытых</h2><div class="card small" id="asum"></div><div id="arch"></div>
</div>
<div id="chart"><div class="row" id="ch_h"></div><canvas id="cv"></canvas><div class="row" id="ch_t"></div><div class="row" id="ch_c" hidden></div><div class="small mut" id="ch_f" style="padding-top:4px"></div><div id="sheet" hidden></div><div id="toast" hidden></div></div>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const S={st:null,px:{},k:{},evt:[],arch:[],archN:30,t:0,tpx:0,q:0,off:0};
const $=s=>document.querySelector(s);
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fp(p){if(p==null||isNaN(p))return '—';const a=Math.abs(p);return a>=1000?p.toFixed(2):a>=10?p.toFixed(3):a>=1?p.toFixed(4):a>=.1?p.toFixed(5):p.toFixed(6)}
function sg(n,d){return n==null||isNaN(n)?'—':(n>=0?'+':'')+n.toFixed(d)}
function cls(n){return n>0?'g':n<0?'r':''}
function usd(s){return s&&s.endsWith('USDT')?s:s+'USDT'}
function px(sym){return S.px[usd(sym||'')]}
function tm(ms){return new Date(ms).toLocaleTimeString('ru-RU')}
function dt(ms){const d=new Date(ms);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function side(s){return h('span','pill '+(s==='long'?'L':'S'),s==='long'?'LONG':'SHORT')}
function dirty(){if(!S.q){S.q=1;requestAnimationFrame(()=>{S.q=0;try{render();drawChart()}catch(e){console.error(e)}})}}

function authMsg(){
  const hs=new URLSearchParams(location.hash.slice(1));const init=hs.get('tgWebAppData');
  if(init)return{init};
  const t=hs.get('t');if(t){try{localStorage.setItem('lt',t)}catch(e){}history.replaceState(null,'',location.pathname);return{tok:t}}
  let t2='';try{t2=localStorage.getItem('lt')||''}catch(e){}return{tok:t2}
}
let ws,back=1,authed=false;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/live/ws');authed=false;
  ws.onopen=()=>ws.send(JSON.stringify(authMsg()));
  ws.onmessage=e=>{const m=JSON.parse(e.data);S.t=Date.now();if(m.srv)S.off=m.srv-Date.now();
    if(m.t==='deny'){$('#msg').textContent='Нет доступа. Открой страницу кнопкой в боте или по своей ссылке.';back=3600;return}
    if(m.t==='hello'){S.ctl=!!m.ctl;authed=true;back=1;S.st=m.state;S.arch=m.arch||[];S.px=m.px||{};S.k=m.k||{};S.evt=(m.evt||[]).slice().reverse();$('#msg').hidden=true;$('#main').hidden=false;if(CH)reqCandles()}
    else if(m.t==='state'){S.st=m}
    else if(m.t==='arch'){S.arch=m.a||[]}
    else if(m.t==='px'){Object.assign(S.px,m.p||{});S.k=m.k||S.k;S.tpx=Date.now();tickChart()}
    else if(m.t==='evt'){m.e.n=1;S.evt.unshift(m.e);S.evt.length=Math.min(S.evt.length,80)}
    else if(m.t==='candles'){gotCandles(m)}
    else if(m.t==='ack'){gotAck(m)}
    dirty()};
  ws.onclose=()=>{authed=false;dirty();setTimeout(connect,Math.min(back,30)*1000);back=Math.min(back*2,3600)};
  ws.onerror=()=>{try{ws.close()}catch(e){}}
}
addEventListener('load',()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor('#0b0e14');Telegram.WebApp.setBackgroundColor('#0b0e14')}catch(e){}});
setInterval(dirty,1000);

/* ---------- графики ---------- */
const IVMS={'1m':60000,'5m':300000,'15m':900000,'1h':3600000,'4h':14400000,'1d':86400000};
let CH=null,rid=0;const P=new Map();let G=null;
function chanAt(l,t){return l?l.p1+l.s*(t-l.t1):null}
function clampLim(x){return Math.max(100,Math.min(1000,Math.round(x)))}
function fitView(){
  const iv=IVMS[CH.iv];
  if(CH.closed)CH.view={n:Math.max(40,Math.round((CH.t_out-CH.t_in)/iv)+60),tL:CH.t_in-30*iv,follow:false,y:null};
  else CH.view={n:(CH.view&&CH.view.n)||100,tL:0,follow:true,y:null};
  CH.lim=CH.closed?clampLim((CH.t_out-CH.t_in)/iv+250):Math.max(CH.lim||300,300)
}
let INV=true;try{INV=(localStorage.getItem('inv')||'1')==='1'}catch(e){}
const ckey=sym=>'cv:'+usd(sym);
function loadView(sym){try{return JSON.parse(localStorage.getItem(ckey(sym))||'null')||JSON.parse(localStorage.getItem('cv:*')||'null')||{}}catch(e){return {}}}
function saveView(){if(!CH||CH.closed)return;try{const o={iv:CH.iv,n:Math.round(CH.view.n)},cur=px(CH.sym);if(CH.view.y&&cur)o.yr=[CH.view.y.lo/cur-1,CH.view.y.hi/cur-1];localStorage.setItem(ckey(CH.sym),JSON.stringify(o));localStorage.setItem('cv:*',JSON.stringify({iv:CH.iv,n:o.n}))}catch(e){}}
let svT=0;function saveSoon(){clearTimeout(svT);svT=setTimeout(saveView,300)}
function openChart(ctx){
  const sv=ctx.closed?{}:loadView(ctx.sym);
  CH=Object.assign({iv:IVMS[sv.iv]?sv.iv:'5m',cs:[],ok:0,loading:0,lim:300},ctx);fitView();
  if(!CH.closed){const cur=px(CH.sym);if(sv.n)CH.view.n=cl(sv.n,12,800);if(sv.yr&&cur){CH.view.y={lo:cur*(1+sv.yr[0]),hi:cur*(1+sv.yr[1])};CH.view.follow=true}}
  $('#chart').classList.add('on');$('#sheet').hidden=true;$('#toast').hidden=true;buildChartHead();reqCandles();dirty()
}
function closeChart(){saveView();CH=null;P.clear();$('#chart').classList.remove('on')}
function syncCtx(){      // линии графика берутся из ЖИВОГО состояния, а не из снимка на момент открытия
  if(!CH||!S.st||!CH.kind)return;const st=S.st;
  if(CH.kind==='pos'){const p=(st.open||[]).find(x=>x.id===CH.sid);
    if(p){Object.assign(CH,{entry:p.entry,stop:p.stop,stop0:p.stop0,tp:p.tp_manual!=null?p.tp_manual:p.tp,be:p.be_px,lock:p.lock_px,sman:p.stop_manual,tman:p.tp_manual!=null,mtrail:p.manual_trail,R:p.R,t_in:p.t_in,gone:0});if(p.ch)CH.ch=p.ch}
    else CH.gone=1}
  else if(CH.kind==='pend'){let o=(st.pend||[]).find(x=>x.id===CH.sid);if(!o){o=(st.pend||[]).find(x=>x.sym===CH.sym.replace('USDT','')&&x.side===CH.side);if(o)CH.sid=o.id}
    if(o){Object.assign(CH,{entry:o.price,stop:o.stop,tp:o.tp,rule:o.rule,line_px:o.line_px,gone:0});if(o.ch)CH.ch=o.ch}else CH.gone=1}
  else if(CH.kind==='watch'){const w=(st.watch||[]).find(x=>x.id===CH.sid);if(w){CH.line_px=w.lp;if(w.ch)CH.ch=w.ch;CH.gone=0}else CH.gone=1}
}
/* ---- управление (только на порту управления через туннель) ---- */
let pendAct=null,lastA=null;
function toast(t,ok){const e=$('#toast');e.textContent=t;e.style.borderColor=ok?'#2ebd85':'#f6465d';e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
function sheet(title,detail,btns){const e=$('#sheet');e.replaceChildren();e.append(h('div','t',title),h('div','d',detail));const r=h('div','r');
  for(const [l,f,c] of btns){const b=h('button','cb'+(c?' '+c:''),l);b.onclick=()=>{e.hidden=true;CH&&(CH.drag=null);dirty();f&&f()};r.append(b)}e.append(r);e.hidden=false}
function act(a,extra){const r=Math.random().toString(36).slice(2,8);pendAct=r;lastA=a;send(Object.assign({q:'act',a,id:CH.sid,rid:r},extra||{}));toast('Отправляю…',true)}
function xlab(t,iv){const d=new Date(t);if(iv>=864e5)return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});if(iv>=144e5)return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+String(d.getHours()).padStart(2,'0');return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
let pendW=null;
function keepRow(w){const lb=document.createElement('div');lb.className='small';lb.style.cssText='display:flex;align-items:center;gap:12px;margin-top:8px;padding:4px 0';
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!w.keep;cb.disabled=!S.ctl;cb.style.cssText='width:30px;height:30px;flex:none;margin:0';
  cb.onclick=e=>e.stopPropagation();
  cb.onchange=()=>{const r=Math.random().toString(36).slice(2,8);pendW=r;send({q:'act',a:'watch_keep',id:w.id,on:cb.checked,rid:r})};
  lb.append(cb,h('span',w.keep?'g':'mut',w.keep?'Следить: бот ведёт без вопросов и не уходит в сон':(S.ctl?'Следить':'Следить (управление только на порту 18111)')));return lb}
function gotAck(m){if(m.rid===pendW){pendW=null;if(!m.ok)alert('Отказ: '+(m.err||'ошибка'));return}if(m.rid!==pendAct)return;pendAct=null;if(m.ok)toast(lastA==='watch_order'?'Запрос принят: ордер поставит бот в ближайшем цикле, итог придёт в Telegram':'Выполнено. Бот подтвердил.',true);else toast('Отказ: '+(m.err||'ошибка'),false)}
function pnlTxt(){const p=px(CH.sym),sd=CH.side==='long'?1:-1;if(p==null||!CH.entry)return '';const pc=sd*(p/CH.entry-1)*100,r=CH.R?sd*(p-CH.entry)/CH.R:null;return 'Сейчас '+sg(pc,2)+'%'+(r!=null?' ('+sg(r,2)+' R)':'')}
function buildCtl(){
  const pn=$('#ch_c');pn.replaceChildren();const on=S.ctl&&CH&&(CH.kind==='pos'||CH.kind==='pend'||(CH.kind==='watch'&&!CH.gone));pn.hidden=!on;if(!on)return;if(CH.kind==='pend')return buildOrdCtl(pn);if(CH.kind==='watch')return buildWatchCtl(pn);
  const sd=CH.side==='long'?1:-1;
  const B=[['Закрыть',()=>sheet('Закрыть '+CH.side.toUpperCase()+' '+usd(CH.sym).replace('USDT','')+' по рынку?',pnlTxt(),[['Отмена'],['Закрыть',()=>act('close'),'red']]),'red'],
    ['Стоп в БУ',()=>{const be=CH.entry*(1-sd*0.0008);sheet('Стоп в безубыток',pnlTxt()+' · стоп '+fp(CH.stop)+' → '+fp(be)+' (вход с запасом на комиссии)',[['Отмена'],['Подтвердить',()=>act('stop',{price:be}),'grn']])}],
    ['Трейлинг',()=>sheet('Трейлинг-стоп',pnlTxt()+' · расстояние от цены:',[['0.3%',()=>act('trail',{pct:0.3})],['0.5%',()=>act('trail',{pct:0.5})],['1%',()=>act('trail',{pct:1})],['Отмена']])],
    ['Бот ведёт',()=>sheet('Вернуть управление боту?','Ручные стоп и цель снимаются, бот снова ведёт позицию по своим правилам.',[['Отмена'],['Вернуть',()=>{act('auto');setTimeout(()=>{if(CH&&CH.tman)send({q:'act',a:'tp_auto',id:CH.sid,rid:'t'+Date.now()})},900)},'grn']])]];
  for(const [l,f,c] of B){const b=h('button','cb'+(c?' '+c:''),l);b.onclick=f;pn.append(b)}
}
/* ---- постановка ордера из слежения (как кнопки в Telegram: сценарий -> вход -> цель) ---- */
function buildWatchCtl(pn){
  const bs=CH.side.toUpperCase(),ks=CH.side==='short'?'LONG':'SHORT';
  for(const [l,s] of [['↩ Отбой '+bs,'b'],['💥 Пробой '+ks,'k']]){const b=h('button','cb',l);b.onclick=()=>wEntry(s);pn.append(b)}
}
function wEntry(s){
  const k=s==='k',way=k?(CH.side==='short'?'LONG':'SHORT'):CH.side.toUpperCase(),nm=usd(CH.sym).replace('USDT','');
  const E=k?[['Рынок','market'],['Стоп за линией','stop'],['Лимит на ретесте','limit']]:[['Рынок','market'],['Лимит у линии','limit'],['Стоп-ордер','stop']];
  sheet((k?'Пробой ':'Отбой ')+way+' '+nm,'Как входить:',E.map(([l,e])=>[l,()=>wTarget(s,e,l)]).concat([['Отмена']]))
}
function wTarget(s,e,el){
  const k=s==='k',way=k?(CH.side==='short'?'LONG':'SHORT'):CH.side.toUpperCase(),nm=usd(CH.sym).replace('USDT','');
  const T=k?[['0.5 канала','h05'],['1 канал','h1'],['1.5 канала','h15']]:[['Противоп. линия','opp'],['Середина','mid'],['1/4 канала','q1'],['3/4 канала','q3']];
  sheet((k?'Пробой ':'Отбой ')+way+' '+nm+' · '+el,'Цель: доля канала или высота канала за линией',T.map(([l,t])=>[l,()=>act('watch_order',{entry:e,setup:s,target:t}),'grn']).concat([['Отмена']]))
}
/* ---- управление ждущим ордером ---- */
function buildOrdCtl(pn){
  const nm=usd(CH.sym).replace('USDT',''),sdn=CH.side.toUpperCase();
  const B=[['Отменить',()=>sheet('Отменить ордер '+sdn+' '+nm+'?','Вход '+fp(CH.entry)+' · стоп '+fp(CH.stop)+' · цель '+fp(CH.tp),[['Назад'],['Отменить ордер',()=>act('ord_cancel'),'red']]),'red'],
    ['Вход',()=>ordPrompt('entry')],['Стоп',()=>ordPrompt('stop')],['Цель',()=>ordPrompt('tp')]];
  for(const [l,f,c] of B){const b=h('button','cb'+(c?' '+c:''),l);b.onclick=f;pn.append(b)}
}
function ordPrompt(key){
  const old=key==='entry'?CH.entry:CH[key],nm={entry:'вход',stop:'стоп',tp:'цель'}[key];
  const v=window.prompt('Новая цена: '+nm+' (сейчас '+fp(old)+')',String(old));if(v==null)return;
  const x=parseFloat(String(v).replace(',','.'));if(!isFinite(x)||x<=0){toast('Неверная цена',false);return}ordConfirm(key,x)
}
function ordConfirm(key,price){
  const cur=px(CH.sym),lg=CH.side==='long',sd=lg?1:-1,stopOrd=CH.rule==='tg_stop',nm={entry:'Вход',stop:'Стоп',tp:'Цель'}[key];
  const fail=t=>{toast(t,false);CH.drag=null;dirty()};
  if(CH.rule==='tg_market')return fail('Рыночный ордер исполняется сразу: менять нечего, его можно только отменить');
  if(key==='entry'&&cur!=null){const ok=stopOrd?(lg?price>cur:price<cur):(lg?price<cur:price>cur);
    if(!ok)return fail(stopOrd?'Стоп-ордер на вход должен быть '+(lg?'выше':'ниже')+' текущей цены':'Лимит должен стоять '+(lg?'ниже':'выше')+' текущей цены, иначе исполнится сразу')}
  const e=key==='entry'?price:CH.entry,s=key==='stop'?price:CH.stop,t=key==='tp'?price:CH.tp;
  const relOk=sd*(e-s)>0&&sd*(t-e)>0;
  if(!relOk&&key!=='entry')return fail(key==='stop'?'Стоп должен быть '+(lg?'ниже':'выше')+' входа':'Цель должна быть '+(lg?'выше':'ниже')+' входа');
  const R=Math.abs(e-s),rr=R?Math.abs(t-e)/R:null,old=key==='entry'?CH.entry:CH[key],dp=(price/old-1)*100;
  const det=fp(old)+' → '+fp(price)+' ('+sg(dp,2)+'%)'+(rr!=null&&relOk?' · риск '+fp(R)+', цель '+rr.toFixed(2)+' R':'');
  const btns=[['Отмена',()=>{CH.drag=null;dirty()}]];

}

      const l=h('div','row small mut');l.append(h('span',null,'стоп '+fp(p.stop)),h('span','sp'),h('span',null,'вход '+fp(p.entry)),h('span','sp'),h('span',null,'цель '+fp(p.tp)));c.append(l)}
    op.append(c)}
  if(!(st.open||[]).length)op.append(h('div','card mut','Открытых позиций нет'));
