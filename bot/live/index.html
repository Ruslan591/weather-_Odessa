<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бот · онлайн</title>
<style>
:root{--bg:#0b0e14;--card:#141923;--bd:#232b3a;--tx:#e6e9ef;--mut:#8b94a7;--g:#2ebd85;--r:#f6465d;--a:#f0b90b;--b:#4c8dff;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f8;--card:#fff;--bd:#dde2ea;--tx:#161b25;--mut:#667085;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 10px calc(env(safe-area-inset-bottom,0) + 24px)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--r);flex:none}.dot.ok{background:var(--g)}.dot.warn{background:var(--a)}
.big{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.small{font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 2px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid div{font-variant-numeric:tabular-nums}.grid b{display:block;font-size:15px}
.bar{position:relative;height:6px;border-radius:3px;margin:9px 2px 4px;background:linear-gradient(90deg,var(--r),var(--bd) 50%,var(--g))}
.bar i{position:absolute;top:-4px;width:3px;height:14px;background:var(--tx);border-radius:2px}.bar u{position:absolute;top:-2px;width:2px;height:10px;background:var(--mut)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;background:var(--bd)}
.pill.L{background:rgba(46,189,133,.2);color:var(--g)}.pill.S{background:rgba(246,70,93,.2);color:var(--r)}
.ev{padding:5px 2px;border-bottom:1px solid var(--bd);word-break:break-word}.ev time{color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.ev.n{animation:fl 2.5s}@keyframes fl{from{background:rgba(76,141,255,.25)}to{background:transparent}}
#msg{padding:30px 10px;text-align:center;color:var(--mut)}
</style></head><body>
<div class="top"><div class="row"><span class="dot" id="dot"></span><span id="conn" class="small mut">подключение…</span><span class="sp"></span><span id="mode" class="small mut"></span></div>
<div class="row" style="margin-top:4px"><span class="big" id="btc">BTC —</span><span id="k" class="small"></span><span class="sp"></span><span id="cols" class="small"></span></div>
<div class="small mut" id="reg"></div></div>
<div id="msg">Подключение…</div>
<div id="main" hidden>
<h2>Счёт</h2><div class="card grid" id="acc"></div>
<h2>Открытые позиции</h2><div id="open"></div>
<h2>Ордера в ожидании</h2><div id="pend"></div>
<h2>Слежения у линий</h2><div id="watch"></div>
<h2>События</h2><div class="card" id="evt"></div>
</div>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const S={st:null,px:{},k:{},evt:[],t:0,tpx:0,q:0};
const $=s=>document.querySelector(s);
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fp(p){if(p==null||isNaN(p))return '—';const a=Math.abs(p);return a>=1000?p.toFixed(2):a>=10?p.toFixed(3):a>=1?p.toFixed(4):a>=.1?p.toFixed(5):p.toFixed(6)}
function sg(n,d){return n==null||isNaN(n)?'—':(n>=0?'+':'')+n.toFixed(d)}
function cls(n){return n>0?'g':n<0?'r':''}
function px(sym){return S.px[(sym||'').endsWith('USDT')?sym:sym+'USDT']}
function tm(ms){return new Date(ms).toLocaleTimeString('ru-RU')}
function side(s){const p=h('span','pill '+(s==='long'?'L':'S'),s==='long'?'LONG':'SHORT');return p}
function dirty(){if(!S.q){S.q=1;requestAnimationFrame(()=>{S.q=0;try{render()}catch(e){console.error(e)}})}}

function authMsg(){
  const hs=new URLSearchParams(location.hash.slice(1));const init=hs.get('tgWebAppData');
  if(init)return{init};
  const t=hs.get('t');if(t){try{localStorage.setItem('lt',t)}catch(e){}history.replaceState(null,'',location.pathname);return{tok:t}}
  let t2='';try{t2=localStorage.getItem('lt')||''}catch(e){}return{tok:t2}
}
let ws,back=1,authed=false;
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/live/ws');authed=false;
  ws.onopen=()=>ws.send(JSON.stringify(authMsg()));
  ws.onmessage=e=>{const m=JSON.parse(e.data);S.t=Date.now();
    if(m.t==='deny'){$('#msg').textContent='Нет доступа. Открой страницу кнопкой в боте или по своей ссылке.';back=3600;return}
    if(m.t==='hello'){authed=true;back=1;S.st=m.state;S.px=m.px||{};S.k=m.k||{};S.evt=(m.evt||[]).slice().reverse();$('#msg').hidden=true;$('#main').hidden=false}
    else if(m.t==='state'){S.st=m}
    else if(m.t==='px'){Object.assign(S.px,m.p||{});S.k=m.k||S.k;S.tpx=Date.now()}
    else if(m.t==='evt'){m.e.n=1;S.evt.unshift(m.e);S.evt.length=Math.min(S.evt.length,80)}
    dirty()};
  ws.onclose=()=>{authed=false;dirty();setTimeout(connect,Math.min(back,30)*1000);back=Math.min(back*2,3600)};
  ws.onerror=()=>{try{ws.close()}catch(e){}}
}
addEventListener('load',()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}});
setInterval(dirty,1000);

function render(){
  const st=S.st,now=Date.now(),on=ws&&ws.readyState===1&&authed,lag=S.tpx?(now-S.tpx)/1000:null;
  $('#dot').className='dot'+(on?(lag!=null&&lag>8?' warn':' ok'):'');
  $('#conn').textContent=on?(lag==null?'онлайн':'онлайн · цены '+(lag<2?'сейчас':Math.round(lag)+' с назад')):'нет связи, переподключаюсь…';
  const b=px('BTCUSDT'),k=S.k||{};$('#btc').textContent='BTC '+(b?fp(b):'—');
  const kp=k.o?(k.c/k.o-1)*100:null;const ke=$('#k');ke.textContent=kp==null?'':'свеча 1m '+sg(kp,3)+'%';ke.className='small '+(kp==null?'':kp>0?'g':kp<0?'r':'');
  if(!st)return;
  const b1=st.b1||{},bs=b1.short||b1.long||{};$('#cols').textContent=(bs.cols||'').split('').map(c=>c==='r'?'🔴':c==='g'?'🟢':'⚪').join('')+(bs.rsi!=null?' RSI '+Number(bs.rsi).toFixed(0):'');
  const rg=st.reg||{},d=rg.detail||{};$('#reg').textContent='Рынок: '+({down:'падающий',up:'растущий',flat:'флэт'}[rg.regime]||rg.regime||'—')+(d.bear!=null?' · факторов вниз '+d.bear+', вверх '+d.bull:'')+(d.adx?' · ADX '+d.adx:'');
  const md=st.mode||{};$('#mode').textContent=(md.mode||'')+(md.express?' · экспресс':'')+(md.autoorder?' · автоордер':'');
  // позиции
  let unreal=0,all=true;const op=$('#open');op.replaceChildren();
  for(const p of st.open||[]){const s=p.side==='long'?1:-1,x=px(p.sym),c=h('div','card');
    const pct=x?(x/p.entry-1)*s*100:null,usd=pct!=null?pct/100*p.stake:null,r=x&&p.R?(x-p.entry)*s/p.R:null;
    if(usd==null)all=false;else unreal+=usd;
    const t=h('div','row');t.append(h('b',null,p.sym.replace('USDT','')),side(p.side),h('span','mut small','#'+p.id+' · '+(p.t_in?tm(p.t_in):'')),h('span','sp'),h('b','big '+cls(pct),pct==null?'—':sg(pct,2)+'%'));c.append(t);
    const g=h('div','grid');for(const [l,v,cl] of [['сейчас',fp(x)],['P&L',usd==null?'—':sg(usd,3)+' $',cls(usd)],['R',r==null?'—':sg(r,2)+' R',cls(r)]]){const e=h('div');e.append(h('span','mut small',l),h('b',cl,v));g.append(e)}c.append(g);
    if(p.tp!=null&&p.stop!=null&&p.tp!==p.stop){const f=v=>Math.max(0,Math.min(100,(v-p.stop)/(p.tp-p.stop)*100));const br=h('div','bar'),i=h('i'),u=h('u');i.style.left=(x?f(x):50)+'%';u.style.left=f(p.entry)+'%';br.append(u,i);c.append(br);
      const l=h('div','row small mut');l.append(h('span',null,'стоп '+fp(p.stop)),h('span','sp'),h('span',null,'вход '+fp(p.entry)),h('span','sp'),h('span',null,'цель '+fp(p.tp)));c.append(l)}
    op.append(c)}
  if(!(st.open||[]).length)op.append(h('div','card mut','Открытых позиций нет'));
  const a=st.acc||{},ua=all&&(st.open||[]).length?unreal:(a.unreal||0),eq=a.start!=null?a.start+(a.realized||0)+ua:null,sl=st.slots||{};
  const ac=$('#acc');ac.replaceChildren();for(const [l,v,cl] of [['эквити',eq==null?'—':eq.toFixed(3)+' $'],['свободно',a.free==null?'—':a.free.toFixed(2)+' $'],['слоты',sl.slots!=null?(st.open||[]).length+' / '+sl.slots:'—'],['реализ.',sg(a.realized,3)+' $',cls(a.realized)],['нереализ.',sg(ua,3)+' $',cls(ua)],['закрыто',a.closed!=null?a.closed:'—']]){const e=h('div');e.append(h('span','mut small',l),h('b',cl,v));ac.append(e)}
  // ордера
  const pe=$('#pend');pe.replaceChildren();
  for(const o of st.pend||[]){const s=o.side==='long'?1:-1,x=px(o.sym),c=h('div','card'),l1=o.live1m||null;
    const t=h('div','row');t.append(h('b',null,o.sym),side(o.side),h('span','mut small','#'+o.id),h('span','sp'),h('span','small mut',o.approved_t?'ждёт '+Math.floor((now-o.approved_t)/1000)+' с из 600':''));c.append(t);
    const mv=x&&o.line_px&&o.atr?(x-o.line_px)*s/o.atr:null;
    c.append(h('div','small',(l1?(l1.ok?'✅ BTC 1m по ходу':'⏳ BTC 1m не по ходу: свеча '+sg((l1.c/l1.o-1)*100,3)+'%'):'проверка BTC 1m в момент открытия…')+(o.live1m_tries?' · попытка '+o.live1m_tries:'')));
    c.append(h('div','small mut','цена '+fp(x)+' · от линии '+(mv==null?'—':sg(mv,2)+' ATR'+(st.mx?' (лимит '+st.mx+')':''))+' · стоп '+fp(o.stop)+' · цель '+fp(o.tp)));pe.append(c)}
  if(!(st.pend||[]).length)pe.append(h('div','card mut','Нет ордеров в ожидании'));
  // слежения
  const we=$('#watch');we.replaceChildren();
  const ws_=(st.watch||[]).map(w=>{const x=px(w.sym);return Object.assign({x,dist:x&&w.lp&&w.atr?(x-w.lp)/w.atr:null},w)}).sort((p,q)=>Math.abs(p.dist??99)-Math.abs(q.dist??99));
  for(const w of ws_){const c=h('div','card'),t=h('div','row');t.append(h('b',null,w.sym),side(w.side),h('span','mut small',(w.line==='upper'?'верх':'низ')+' · '+(w.state||'')),h('span','sp'),h('b',null,w.dist==null?'—':sg(w.dist,2)+' ATR'));c.append(t);
    c.append(h('div','small mut','цена '+fp(w.x)+' · линия '+fp(w.lp)+(w.tf?' · слежу с '+tm(w.tf):'')));we.append(c)}
  if(!ws_.length)we.append(h('div','card mut','Активных слежений нет'));
  // события
  const ev_=$('#evt');ev_.replaceChildren();
  for(const e of S.evt){const d=h('div','ev'+(e.n?' n':''));d.append(h('time',null,tm(e.t)),h('span',/отмен|истёк/.test(e.x)?'r':/✅/.test(e.x)?'g':/⏳/.test(e.x)?'a':'',e.x));ev_.append(d);e.n=0}
  if(!S.evt.length)ev_.append(h('div','mut','Пока пусто'));
}
connect();
</script></body></html>
