<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14"><meta name="color-scheme" content="dark">
<title>Бот · онлайн</title>
<style>
:root{--bg:#0b0e14;--card:#141923;--bd:#232b3a;--tx:#e6e9ef;--mut:#8b94a7;--g:#2ebd85;--r:#f6465d;--a:#f0b90b;--b:#4c8dff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 10px calc(env(safe-area-inset-bottom,0) + 24px)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--r);flex:none}.dot.ok{background:var(--g)}.dot.warn{background:var(--a)}
.big{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.small{font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 2px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.card.tap{cursor:pointer}.card.tap:active{border-color:var(--b)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid div{font-variant-numeric:tabular-nums}.grid b{display:block;font-size:15px}
.bar{position:relative;height:6px;border-radius:3px;margin:9px 2px 4px;background:linear-gradient(90deg,var(--r),var(--bd) 50%,var(--g))}
.bar i{position:absolute;top:-4px;width:3px;height:14px;background:var(--tx);border-radius:2px}.bar u{position:absolute;top:-2px;width:2px;height:10px;background:var(--mut)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;background:var(--bd)}
.pill.L{background:rgba(46,189,133,.2);color:var(--g)}.pill.S{background:rgba(246,70,93,.2);color:var(--r)}
.cb{background:var(--bd);color:var(--tx);border:0;border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;flex:none}.cb.on{background:var(--b);color:#fff}
.ev{padding:5px 2px;border-bottom:1px solid var(--bd);word-break:break-word}.ev time{color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.ev.n{animation:fl 2.5s}@keyframes fl{from{background:rgba(76,141,255,.25)}to{background:transparent}}
.ar{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--bd);cursor:pointer;font-variant-numeric:tabular-nums}.ar:active{background:var(--card)}
#msg{padding:30px 10px;text-align:center;color:var(--mut)}
#chart{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top,0) 8px calc(env(safe-area-inset-bottom,0) + 8px)}
#ch_h{flex-wrap:nowrap!important;overflow-x:auto;gap:6px;padding:6px 0}#ch_t{flex-wrap:nowrap;gap:5px;padding-top:6px}#ch_t .cb{flex:1;padding:8px 0;font-size:14px}#chart.on{display:flex}#cv{flex:1;width:100%;min-height:0;display:block;touch-action:none}
</style></head><body>
<div class="top"><div class="row"><span class="dot" id="dot"></span><span id="conn" class="small mut">подключение…</span><span class="sp"></span><span id="mode" class="small mut"></span></div>
<div class="row" style="margin-top:4px"><span class="big" id="btc">BTC —</span><span id="k" class="small"></span><span class="sp"></span><span id="cols" class="small"></span></div>
<div class="small mut" id="reg"></div></div>
<div id="msg">Подключение…</div>
<div id="main" hidden>
<h2>Счёт</h2><div class="card grid" id="acc"></div>
<h2>Открытые позиции</h2><div id="open"></div>
<h2>Ордера в ожидании</h2><div id="pend"></div>
<h2>Слежения у линий</h2><div id="watch"></div>
<h2>События</h2><div class="card" id="evt"></div>
<h2>Архив закрытых</h2><div class="card small" id="asum"></div><div id="arch"></div>
</div>
<div id="chart"><div class="row" id="ch_h"></div><canvas id="cv"></canvas><div class="row" id="ch_t"></div><div class="small mut" id="ch_f" style="padding-top:4px"></div></div>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const S={st:null,px:{},k:{},evt:[],arch:[],archN:30,t:0,tpx:0,q:0,off:0};
const $=s=>document.querySelector(s);
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fp(p){if(p==null||isNaN(p))return '—';const a=Math.abs(p);return a>=1000?p.toFixed(2):a>=10?p.toFixed(3):a>=1?p.toFixed(4):a>=.1?p.toFixed(5):p.toFixed(6)}
function sg(n,d){return n==null||isNaN(n)?'—':(n>=0?'+':'')+n.toFixed(d)}
function cls(n){return n>0?'g':n<0?'r':''}
function usd(s){return s&&s.endsWith('USDT')?s:s+'USDT'}
function px(sym){return S.px[usd(sym||'')]}
function tm(ms){return new Date(ms).toLocaleTimeString('ru-RU')}
function dt(ms){const d=new Date(ms);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function side(s){return h('span','pill '+(s==='long'?'L':'S'),s==='long'?'LONG':'SHORT')}
function dirty(){if(!S.q){S.q=1;requestAnimationFrame(()=>{S.q=0;try{render();drawChart()}catch(e){console.error(e)}})}}

function authMsg(){
  const hs=new URLSearchParams(location.hash.slice(1));const init=hs.get('tgWebAppData');
  if(init)return{init};
  const t=hs.get('t');if(t){try{localStorage.setItem('lt',t)}catch(e){}history.replaceState(null,'',location.pathname);return{tok:t}}
  let t2='';try{t2=localStorage.getItem('lt')||''}catch(e){}return{tok:t2}
}
let ws,back=1,authed=false;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/live/ws');authed=false;
  ws.onopen=()=>ws.send(JSON.stringify(authMsg()));
  ws.onmessage=e=>{const m=JSON.parse(e.data);S.t=Date.now();if(m.srv)S.off=m.srv-Date.now();
    if(m.t==='deny'){$('#msg').textContent='Нет доступа. Открой страницу кнопкой в боте или по своей ссылке.';back=3600;return}
    if(m.t==='hello'){authed=true;back=1;S.st=m.state;S.arch=m.arch||[];S.px=m.px||{};S.k=m.k||{};S.evt=(m.evt||[]).slice().reverse();$('#msg').hidden=true;$('#main').hidden=false;if(CH)reqCandles()}
    else if(m.t==='state'){S.st=m}
    else if(m.t==='arch'){S.arch=m.a||[]}
    else if(m.t==='px'){Object.assign(S.px,m.p||{});S.k=m.k||S.k;S.tpx=Date.now();tickChart()}
    else if(m.t==='evt'){m.e.n=1;S.evt.unshift(m.e);S.evt.length=Math.min(S.evt.length,80)}
    else if(m.t==='candles'){gotCandles(m)}
    dirty()};
  ws.onclose=()=>{authed=false;dirty();setTimeout(connect,Math.min(back,30)*1000);back=Math.min(back*2,3600)};
  ws.onerror=()=>{try{ws.close()}catch(e){}}
}
addEventListener('load',()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor('#0b0e14');Telegram.WebApp.setBackgroundColor('#0b0e14')}catch(e){}});
setInterval(dirty,1000);

/* ---------- графики ---------- */
const IVMS={'1m':60000,'5m':300000,'15m':900000,'1h':3600000};
let CH=null,rid=0;const P=new Map();let G=null;
function chanAt(l,t){return l?l.p1+l.s*(t-l.t1):null}
function clampLim(x){return Math.max(100,Math.min(1000,Math.round(x)))}
function fitView(){
  const iv=IVMS[CH.iv];
  if(CH.closed)CH.view={n:Math.max(40,Math.round((CH.t_out-CH.t_in)/iv)+60),tL:CH.t_in-30*iv,follow:false,y:null};
  else CH.view={n:(CH.view&&CH.view.n)||100,tL:0,follow:true,y:null};
  CH.lim=CH.closed?clampLim((CH.t_out-CH.t_in)/iv+250):Math.max(CH.lim||300,300)
}
function openChart(ctx){
  CH=Object.assign({iv:'5m',cs:[],ok:0,loading:0,lim:300},ctx);fitView();
  $('#chart').classList.add('on');buildChartHead();reqCandles();dirty()
}
function closeChart(){CH=null;P.clear();$('#chart').classList.remove('on')}
function reqCandles(){
  if(!CH)return;CH.rid=++rid;const q={q:'candles',sym:usd(CH.sym),iv:CH.iv,lim:CH.lim,rid:CH.rid};
  if(CH.oid!=null)q.oid=CH.oid;if(CH.closed)q.end=Math.min(CH.t_out+40*IVMS[CH.iv],Date.now()+S.off);send(q)
}
function gotCandles(m){
  if(!CH||m.rid!==CH.rid)return;CH.loading=0;if(m.err){CH.err=1;return}
  CH.err=0;CH.cs=m.c||[];CH.ok=1;if(m.ch)CH.ch=m.ch;CH.fresh=Date.now()
}
function tickChart(){
  if(!CH||CH.closed||!CH.cs.length)return;const p=px(CH.sym);if(p==null)return;
  const iv=IVMS[CH.iv],now=Date.now()+S.off,cur=Math.floor(now/iv)*iv,l=CH.cs[CH.cs.length-1];
  if(cur>l[0]){CH.cs.push([cur,p,p,p,p,0]);if(CH.cs.length>CH.lim+100)CH.cs.shift()}
  else{l[4]=p;if(p>l[2])l[2]=p;if(p<l[3])l[3]=p}
}
setInterval(()=>{if(CH&&!CH.closed&&!CH.loading)reqCandles()},20000);
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function mmss(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function layoutLabels(lab,top,bot){
  lab.sort((a,b)=>a.y-b.y);let prev=-1e9;
  for(const L of lab){L.h=L.sub?28:16;L.t=Math.max(L.y-L.h/2,prev+1);prev=L.t+L.h}
  let nxt=bot;for(let i=lab.length-1;i>=0;i--){const L=lab[i];if(L.t+L.h>nxt)L.t=nxt-L.h;nxt=L.t-1}
  return lab
}
function leftT(){const v=CH.view,iv=IVMS[CH.iv],cs=CH.cs;return v.follow&&cs.length?cs[cs.length-1][0]+iv*6-v.n*iv:v.tL}
function setN(n1,b){      // масштаб по времени: всегда вручную, без привязки к правому краю; опора: точка между пальцами (mid) или центр
  const v=CH.view,iv=IVMS[CH.iv],pw=CH.pw||300;n1=cl(n1,12,800);
  const xf=b.mid!=null?b.mid/pw:.5,tAt=b.tL+xf*b.n*iv;v.tL=tAt-xf*n1*iv;v.n=n1;v.follow=false;dirty()
}
function panTo(tL){       // сдвиг по времени: после любого сдвига следование за ценой выключено, пока не нажмёшь ⏭
  const v=CH.view,iv=IVMS[CH.iv],cs=CH.cs;if(!cs.length)return;const first=cs[0][0],last=cs[cs.length-1][0];
  v.tL=cl(tL,first-.6*v.n*iv,last+iv*8+.6*v.n*iv-v.n*iv*.5);v.follow=false;dirty()
}
function curBase(){const v=CH.view;return{tL:leftT(),n:v.n,follow:v.follow}}
function freezeY(){const v=CH.view;if(!v.y&&CH.yr)v.y={lo:CH.yr.lo,hi:CH.yr.hi};return v.y}
function scaleY(f){const y=freezeY();if(!y)return;const c=(y.lo+y.hi)/2,hf=(y.hi-y.lo)/2*f;CH.view.y={lo:c-hf,hi:c+hf};dirty()}
function buildChartHead(){
  const hd=$('#ch_h');hd.replaceChildren();
  const x=h('button','cb','✕');x.onclick=closeChart;hd.append(x,h('b',null,usd(CH.sym).replace('USDT','')),CH.side?side(CH.side):h('span'),h('span','sp'));
  for(const iv of Object.keys(IVMS)){const b=h('button','cb'+(CH.iv===iv?' on':''),iv);b.onclick=()=>{CH.iv=iv;CH.cs=[];CH.cross=null;fitView();buildChartHead();reqCandles()};hd.append(b)}
  const tb=$('#ch_t');tb.replaceChildren();const iv=()=>IVMS[CH.iv];
  const B=[['◀',()=>panTo(leftT()-CH.view.n*iv()*.25)],['▶',()=>panTo(leftT()+CH.view.n*iv()*.25)],['↔−',()=>setN(CH.view.n*1.25,curBase())],['↔+',()=>setN(CH.view.n*.8,curBase())],
    ['↕−',()=>scaleY(1.25)],['↕+',()=>scaleY(1/1.25)],
    ['⟲',()=>{const l=CH.lim;CH.cross=null;fitView();CH.lim=Math.max(l,CH.lim);if(!CH.closed)CH.view.n=100;dirty()}],['⏭',()=>{CH.cross=null;if(CH.closed){const l=CH.lim;fitView();CH.lim=l}else{CH.view.follow=true;CH.view.y=null}dirty()}]];
  for(const [l,f] of B){const b=h('button','cb',l);b.onclick=f;tb.append(b)}
}
(function(){
  const cv=document.getElementById('cv'),pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const endLP=()=>{if(G&&G.lp){clearTimeout(G.lp);G.lp=null}};
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}const q=pos(e);P.set(e.pointerId,q);if(!CH)return;const v=CH.view;
    if(P.size===1){const y0=(q.x>CH.pw?freezeY():null)||v.y;G={x:q.x,y:q.y,tL:leftT(),n:v.n,y0:y0?{lo:y0.lo,hi:y0.hi}:null,zone:q.x>CH.pw?'price':q.y>CH.yT?'time':'plot',moved:0,mode:null,wasCross:!!CH.cross,ppp:CH.ppp||0};
      G.lp=setTimeout(()=>{G.lp=null;if(G&&!G.moved&&P.size===1&&G.zone==='plot'){CH.cross={x:G.x,y:G.y};G.mode='cross';dirty()}},380)}
    else if(P.size===2&&G){endLP();const a=[...P.values()],y0=freezeY();G.pinch={dx:Math.abs(a[0].x-a[1].x),dy:Math.abs(a[0].y-a[1].y),n:v.n,mid:(a[0].x+a[1].x)/2,tL:leftT(),y0:y0?{lo:y0.lo,hi:y0.hi}:null};G.moved=1;CH.cross=null}});
  cv.addEventListener('pointermove',e=>{if(!CH||!G||!P.has(e.pointerId))return;const q=pos(e);P.set(e.pointerId,q);const v=CH.view,iv=IVMS[CH.iv];
    if(G.mode==='cross'){CH.cross={x:q.x,y:q.y};dirty();return}
    if(P.size>=2&&G.pinch){const a=[...P.values()],dx=Math.abs(a[0].x-a[1].x),dy=Math.abs(a[0].y-a[1].y);
      if(G.pinch.dy>G.pinch.dx*1.2&&G.pinch.y0){const f=Math.max(G.pinch.dy,10)/Math.max(dy,10),c=(G.pinch.y0.lo+G.pinch.y0.hi)/2,hf=(G.pinch.y0.hi-G.pinch.y0.lo)/2*f;v.y={lo:c-hf,hi:c+hf};dirty()}
      else setN(G.pinch.n*Math.max(G.pinch.dx,10)/Math.max(dx,10),G.pinch);return}
    const dx=q.x-G.x,dy=q.y-G.y;if(Math.abs(dx)>6||Math.abs(dy)>6){G.moved=1;endLP()}if(!G.moved)return;
    if(G.zone==='price'&&G.y0){const c=(G.y0.lo+G.y0.hi)/2,hf=(G.y0.hi-G.y0.lo)/2*Math.exp(dy/120);v.y={lo:c-hf,hi:c+hf};dirty()}
    else if(G.zone==='time')setN(G.n*Math.exp(-dx/120),G);
    else{panTo(G.tL-dx/(CH.pw||300)*G.n*iv);if(G.ppp){const y=G.y0||freezeY();if(y){G.y0=G.y0||{lo:y.lo,hi:y.hi};v.y={lo:G.y0.lo+dy*G.ppp,hi:G.y0.hi+dy*G.ppp}}}dirty()}});
  const up=e=>{endLP();if(G&&!G.moved&&G.mode!=='cross'&&G.wasCross){CH&&(CH.cross=null);dirty()}P.delete(e.pointerId);if(!P.size)G=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{if(!CH)return;e.preventDefault();const f=e.deltaY>0?1.15:1/1.15;
    if(e.shiftKey)scaleY(f);else if(e.altKey)panTo(leftT()+(e.deltaY>0?1:-1)*CH.view.n*IVMS[CH.iv]*.1);
    else setN(CH.view.n*f,Object.assign(curBase(),{mid:pos(e).x}))},{passive:false});
  cv.addEventListener('dblclick',()=>{if(CH){CH.view.n=100;CH.view.follow=!CH.closed;CH.view.y=null;CH.cross=null;dirty()}})
})();
function drawChart(){
  if(!CH)return;const cv=$('#cv'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);c.font='11px -apple-system,Segoe UI,sans-serif';
  const cs=CH.cs;if(!cs.length){c.fillStyle='#8b94a7';c.fillText(CH.err?'Нет данных (ошибка), повторяю…':'Загрузка графика…',12,24);return}
  const PR=64,PT=8,PB=20,pw=W-PR,ph=H-PT-PB,vh=ph*.16,iv=IVMS[CH.iv],v=CH.view;CH.pw=pw;
  if(v.follow)v.tL=cs[cs.length-1][0]+iv*6-v.n*iv;
  const t0=v.tL,t1=v.tL+v.n*iv,bw=pw/v.n;
  if(!CH.loading&&CH.lim<1000&&cs.length>=CH.lim*.9&&t0<cs[0][0]+8*iv){CH.lim=clampLim(CH.lim+400);CH.loading=1;reqCandles()}
  let vis=cs.filter(k=>k[0]+iv>t0&&k[0]<t1);if(!vis.length)vis=cs.slice(-20);
  let lo=Math.min(...vis.map(k=>k[3])),hi=Math.max(...vis.map(k=>k[2]));const cur=px(CH.sym);if(cur!=null&&!CH.closed&&t1>cs[cs.length-1][0]){lo=Math.min(lo,cur);hi=Math.max(hi,cur)}
  const span0=hi-lo||hi*.001;
  const lv=[];const add=(x,col,lab,dash)=>{if(x!=null&&isFinite(x))lv.push({v:x,col,lab,dash})};
  add(CH.entry,'#4c8dff',CH.closed||CH.pos?'вход':'вход (ордер)');add(CH.stop0&&CH.stop0!==CH.stop?CH.stop0:null,'#a64a55','стоп нач.',1);add(CH.stop,'#f6465d','стоп');add(CH.tp,'#2ebd85','цель');
  add(CH.exit,'#f0b90b','выход');add(CH.be,'#8b94a7','БУ',1);add(CH.lock,'#8b94a7','лок',1);add(CH.line_px,'#f0b90b','линия',1);
  const chn=[];if(CH.ch&&CH.ch.upper&&CH.ch.lower){const u=CH.ch.upper,l=CH.ch.lower;chn.push(chanAt(u,t0),chanAt(u,t1),chanAt(l,t0),chanAt(l,t1))}
  for(const L of lv){if(L.v>lo-span0&&L.v<hi+span0){lo=Math.min(lo,L.v);hi=Math.max(hi,L.v)}}
  for(const x of chn){if(x>lo-span0&&x<hi+span0){lo=Math.min(lo,x);hi=Math.max(hi,x)}}
  {const rng=(hi-lo)||hi*.01;lo-=rng*.06;hi+=rng*.06}if(v.y){lo=v.y.lo;hi=v.y.hi}CH.yr={lo,hi};CH.ppp=(hi-lo)/Math.max(1,ph-vh);CH.yT=PT+ph;const Y=x=>PT+(hi-x)/(hi-lo)*(ph-vh),X=t=>(t-t0)/(t1-t0)*pw;
  c.save();c.beginPath();c.rect(0,0,pw,H);c.clip();
  c.strokeStyle='#232b3a';c.lineWidth=1;
  for(let i=0;i<=4;i++){const y=Y(lo+(hi-lo)*i/4);c.beginPath();c.moveTo(0,y);c.lineTo(pw,y);c.stroke()}
  const vmax=Math.max(...vis.map(k=>k[5]))||1;
  for(const k of vis){const x=X(k[0]),up=k[4]>=k[1],col=up?'#2ebd85':'#f6465d';c.fillStyle=col+'55';const vv=k[5]/vmax*vh;c.fillRect(x+bw*.15,PT+ph-vv,bw*.7,vv);
    c.strokeStyle=col;c.fillStyle=col;c.beginPath();c.moveTo(x+bw/2,Y(k[2]));c.lineTo(x+bw/2,Y(k[3]));c.stroke();const yo=Y(k[1]),yc=Y(k[4]);c.fillRect(x+bw*.15,Math.min(yo,yc),Math.max(1,bw*.7),Math.max(1,Math.abs(yc-yo)))}

  c.lineWidth=1;const lab=[];

  c.restore();
  c.fillStyle='#8b94a7';for(let i=0;i<=4;i++){const x=lo+(hi-lo)*i/4;c.fillText(fp(x),pw+4,Y(x)+3)}

      const lb=new Date(tc).toLocaleString('ru-RU',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),lw=c.measureText(lb).width+12,lx=Math.max(0,Math.min(xs-lw/2,pw-lw));
